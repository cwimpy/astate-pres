title: AState Revealjs
author: Cameron Wimpy
version: 0.2.0
quarto-required: ">=1.4.0"
contributes:
  formats:
    revealjs:
      theme: [default, astate-revealjs.scss]
      transition: fade
      background-transition: fade
      incremental: true
      scrollable: true
      height: 900
      width: 1600
      chalkboard: true
      slide-number: "c/t"
      email-obfuscation: javascript
      include-in-header:
        - text: |
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
