title: AState Beamer
author: Cameron Wimpy
version: 1.0.0
quarto-required: ">=1.4.0"
contributes:
  formats:
    beamer:
      pdf-engine: xelatex
      theme: AState
      aspectratio: 169
      fontsize: 14pt
      navigation: empty
      latex-auto-install: false
      include-in-header:
        - header.tex
      filters:
        - astate-authors.lua
